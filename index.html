<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地视频分类播放器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar" aria-label="筛选">
        <div class="toolbar-filter">
          <button
            type="button"
            class="btn toolbar-filter-btn"
            id="filterCategoryBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="toolbar-filter-label">筛选分类</span>
          </button>
          <div class="toolbar-filter-panel" id="filterCategoryPanel" role="listbox" hidden></div>
        </div>
        <div class="toolbar-filter">
          <button
            type="button"
            class="btn toolbar-filter-btn"
            id="filterAuthorBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="toolbar-filter-label">筛选作者</span>
          </button>
          <div class="toolbar-filter-panel" id="filterAuthorPanel" role="listbox" hidden></div>
        </div>
        <div class="toolbar-filter">
          <button
            type="button"
            class="btn toolbar-filter-btn"
            id="filterRoleBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="toolbar-filter-label">筛选歌手</span>
          </button>
          <div class="toolbar-filter-panel" id="filterRolePanel" role="listbox" hidden></div>
        </div>
        <div class="toolbar-filter">
          <button
            type="button"
            class="btn toolbar-filter-btn"
            id="filterLevelBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
          >
            <span class="toolbar-filter-label">喜爱等级</span>
          </button>
          <div class="toolbar-filter-panel" id="filterLevelPanel" role="listbox" hidden></div>
        </div>
      </header>

      <main class="main" id="appMain">
        <section class="panel panel-playlist" aria-label="歌曲列表">
          <button type="button" class="btn btn-title" id="playlistTitleBtn">歌曲列表</button>
          <input
            type="search"
            class="btn-title playlist-search"
            id="playlistSearch"
            placeholder="搜索歌名/作者/歌手"
            aria-label="搜索歌曲"
            hidden
          />
          <div class="playlist-body">
            <div class="playlist-grid" id="playlistGrid"></div>
          </div>
          <div class="playlist-controls" id="playlistControls" aria-hidden="true">
            <div class="ctrl-bar" role="toolbar" aria-label="列表控制">
              <button type="button" class="btn btn-icon" id="btnListTop" title="返回顶部" aria-label="返回顶部">
                <svg viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M39.3846 0h945.2307692307693v157.53846153846155h-945.2307692307693V0zM984.6154 708.9231h-236.30769230769232v315.0769230769231h-472.61538461538464V708.9230769230769h-236.30769230769232l472.6154-472.6154L984.6154 708.9231z"/></svg>
              </button>
              <button type="button" class="btn btn-icon" id="btnLocate" title="定位" aria-label="定位">

              </button>
              <button type="button" class="btn btn-icon" id="btnListBottom" title="返回底部" aria-label="返回底部">
                <svg class="icon-flip-y" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M39.3846 0h945.2307692307693v157.53846153846155h-945.2307692307693V0zM984.6154 708.9231h-236.30769230769232v315.0769230769231h-472.61538461538464V708.9230769230769h-236.30769230769232l472.6154-472.6154L984.6154 708.9231z"/></svg>
              </button>
            </div>
          </div>
        </section>
        <section class="panel panel-player" aria-label="歌曲播放">
          <div class="player-body">
            <!-- 1. 视频播放 + 进度（样式对齐原设计） -->
            <div class="player-zone player-zone-video">
              <video id="videoElement" class="player-video" playsinline></video>
            </div>
            <div class="progress-wrap" id="progressWrap">
              <div
                class="progress-track"
                id="progressTrack"
                role="slider"
                tabindex="0"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                aria-label="播放进度"
              >
                <div class="progress-fill" id="progressFill" aria-hidden="true"></div>
                <div class="progress-thumb" id="progressThumb" aria-hidden="true"></div>
                <div class="progress-time-tip" id="progressTimeTip" hidden aria-hidden="true">0:00</div>
              </div>
            </div>

            <!-- 2. 音频可视化 / 当前歌词 -->
            <div class="player-zone player-zone-viz" id="playerZoneViz">
              <canvas id="visualizerCanvas" class="viz-canvas" aria-hidden="true"></canvas>
              <div class="viz-lyrics" id="vizLyrics" hidden>
                <div class="viz-lyrics-empty" id="vizLyricsEmpty">暂无歌词</div>
                <div class="viz-lyrics-current" id="vizLyricsCurrent" hidden>
                  <div class="viz-lyrics-orig" id="vizLyricsOrig"></div>
                  <div class="viz-lyrics-trans" id="vizLyricsTrans"></div>
                </div>
              </div>
            </div>
            <div class="player-divider" aria-hidden="true"></div>

            <!-- 3. 操作按键 -->

              <div class="ctrl-bar" role="toolbar" aria-label="播放控制">

        <section class="panel panel-info" id="infoPanelRoot" aria-label="歌曲信息">
          <h2 class="btn btn-title" id="infoTitleBtn">歌曲信息</h2>
          <div class="info-view" id="infoView">
            <div class="info-row info-row-cover">
              <div class="info-cover-box" id="infoCoverBox">
                <span class="info-cover-placeholder" id="infoCoverPlaceholder">封面</span>
                <img id="infoCoverImg" class="info-cover-img" alt="" hidden />
              </div>
            </div>

            <div class="info-row">
              <span class="info-label">名称：</span>
              <div class="info-field">
                <div
                  class="info-value-box"
                  id="infoNameDisplay"
                  title="点击复制"
                  role="button"
                  tabindex="0"
                  aria-label="点击复制歌名"
                ></div>
              </div>
            </div>

            <div class="info-row">
              <span class="info-label">分类：</span>
              <div class="info-field">
                <div class="info-chips" id="infoCategoryChips"></div>
                <input
                  type="text"
                  class="info-input"
                  id="infoCategoryInput"
                  placeholder="用中文逗号分隔"
                  hidden
                />
              </div>
            </div>

            <div class="info-row">
              <span class="info-label">作者：</span>
              <div class="info-field">
                <div class="info-chips" id="infoAuthorChips"></div>
                <input
                  type="text"
                  class="info-input"
                  id="infoAuthorInput"
                  placeholder="用中文逗号分隔"
                  hidden
                />
              </div>
            </div>

            <div class="info-row">
              <span class="info-label">歌手：</span>
              <div class="info-field">
                <div class="info-chips" id="infoRoleChips"></div>
                <input
                  type="text"
                  class="info-input"
                  id="infoRoleInput"
                  placeholder="用中文逗号分隔"
                  hidden
                />
              </div>
            </div>

            <div class="info-row info-row-colors">
              <div class="info-field info-field-colors">
                <div class="info-color-item">
                  <span class="info-color-caption">背景：</span>
                  <button
                    type="button"
                    class="info-sq info-sq-theme"
                    id="infoThemePreview"
                    title="背景色"
                    aria-label="背景色"
                  ></button>
                </div>
                <div class="info-color-item">
                  <span class="info-color-caption">组件：</span>
                  <button
                    type="button"
                    class="info-sq info-sq-component"
                    id="infoComponentPreview"
                    title="组件色"
                    aria-label="组件色"
                  ></button>
                </div>
              </div>
            </div>

            <div class="info-row">
              <span class="info-label">喜爱：</span>
              <div class="info-field">
                <div class="info-level" id="infoLevel" role="group" aria-label="喜爱等级"></div>
              </div>
            </div>
          </div>
          <div class="info-controls" id="infoControls" aria-hidden="true">
            <div class="ctrl-bar" role="toolbar" aria-label="信息操作">
              <button type="button" class="btn btn-icon" id="btnInfoEdit" title="编辑" aria-label="编辑" aria-pressed="false">

              </button>
              <button type="button" class="btn btn-icon" id="btnInfoExport" title="导出" aria-label="导出">
                <svg viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M687.57 58.3v141.9h149.48zM193.07 157.95h-70.99V877.5h576.06v-69.77H193.07z"/><path fill="currentColor" d="M637.72 58.3h-398.7v709.99h598.03V247.73H637.74l-0.02-189.43z m-59.95 542.17v-83.64H364.08v-95.49h213.69V337.7l181.54 131.38-181.54 131.39z"/></svg>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <canvas id="infoCoverPickCanvas" hidden aria-hidden="true"></canvas>
    <div id="toolbarFilterLayer" class="toolbar-filter-layer" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./main.js"></script>
