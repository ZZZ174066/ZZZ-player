<!DOCTYPE html>
<html lang="zh-CN">

    <div id="app" class="app">

                <div class="progress-thumb" id="progressThumb" aria-hidden="true"></div>
                <div class="progress-time-tip" id="progressTimeTip" hidden>0:00</div>
              </div>
              <span class="progress-time" id="progressTimeDuration">0:00</span>
            </div>

            <div class="player-divider" aria-hidden="true"></div>

            <div class="player-zone player-zone-viz" id="playerZoneViz">
              <canvas id="visualizerCanvas" class="viz-canvas" aria-hidden="true"></canvas>
            </div>

            <div class="player-divider" aria-hidden="true"></div>

            <div class="player-zone player-zone-controls">

        <section class="panel panel-side" id="infoPanelRoot" aria-label="侧栏">
          <div class="side-header" id="infoHeader">
            <button type="button" class="btn side-tab-btn is-active" id="infoTabSongBtn">歌曲信息</button>
            <button type="button" class="btn side-tab-btn" id="infoTabLyricsBtn">歌词信息</button>
          </div>

          <div class="side-meta" id="sideMeta">
            <div class="side-view side-view-info info-view" id="infoView" role="tabpanel">
              <div class="info-layout">
                <div class="info-row info-row-cover">
                  <div class="info-cover-box" id="infoCoverBox">
                    <span class="info-cover-placeholder" id="infoCoverPlaceholder">封面</span>
                    <img id="infoCoverImg" class="info-cover-img" alt="" hidden />
                  </div>
                </div>

                <div class="info-fields">
                  <div class="info-row">
                    <span class="info-label">名称：</span>
                    <div class="info-field">
                      <div class="info-value-box" id="infoNameDisplay"></div>
                      <input
                        type="text"
                        class="info-input"
                        id="infoNameInput"
                        placeholder="歌曲名称"
                        hidden
                      />
                    </div>
                  </div>

                  <div class="info-row">
                    <span class="info-label">作者：</span>
                    <div class="info-field">
                      <div class="info-chips" id="infoAuthorChips"></div>
                      <input
                        type="text"
                        class="info-input"
                        id="infoAuthorInput"
                        placeholder="用中文逗号分隔"
                        hidden
                      />
                    </div>
                  </div>

                  <div class="info-row">
                    <span class="info-label">歌手：</span>
                    <div class="info-field">
                      <div class="info-chips" id="infoRoleChips"></div>
                      <input
                        type="text"
                        class="info-input"
                        id="infoRoleInput"
                        placeholder="用中文逗号分隔"
                        hidden
                      />
                    </div>
                  </div>

                  <div class="info-row info-row-colors">
                    <div class="info-field info-field-colors">
                      <div class="info-color-item">
                        <span class="info-color-caption">背景：</span>
                        <button
                          type="button"
                          class="info-sq info-sq-theme"
                          id="infoThemePreview"
                          title="背景色"
                          aria-label="背景色"
                        ></button>
                      </div>
                      <div class="info-color-item">
                        <span class="info-color-caption">组件：</span>
                        <button
                          type="button"
                          class="info-sq info-sq-component"
                          id="infoComponentPreview"
                          title="组件色"
                          aria-label="组件色"
                        ></button>
                      </div>
                    </div>
                  </div>

                  <div class="info-row">
                    <span class="info-label">喜爱：</span>
                    <div class="info-field">
                      <div class="info-level" id="infoLevel" role="group" aria-label="喜爱等级"></div>
                    </div>
                  </div>
                </div>

                <div class="info-controls" id="infoControls" aria-hidden="false">
                  <div class="ctrl-bar" role="toolbar" aria-label="信息操作">
                    <button type="button" class="btn btn-icon" id="btnInfoEdit" title="编辑" aria-label="编辑" aria-pressed="false">

                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="side-view side-view-lyrics info-lyrics-view" id="infoLyricsView" role="tabpanel" hidden>

              <div class="info-lyrics-stages" id="infoLyricsScroller">
                <div class="info-lyrics-slot info-lyrics-prev" id="infoLyricsPrev" aria-label="上一句"></div>
                <div class="info-lyrics-slot info-lyrics-current" id="infoLyricsCurrent" aria-label="当前歌词"></div>
                <div class="info-lyrics-slot info-lyrics-next" id="infoLyricsNext" aria-label="下一句"></div>
              </div>
            </div>
          </div>

          <div class="side-meta-divider" aria-hidden="true"></div>

          <div class="side-playlist" id="playlistView">
            <div class="playlist-header" id="playlistHeader">
              <div class="toolbar-filter">
                <button type="button" class="btn toolbar-filter-btn" id="filterAuthorBtn" aria-haspopup="listbox" aria-expanded="false">

                </button>
                <div class="toolbar-filter-panel" id="filterAuthorPanel" role="listbox" hidden></div>

              <div class="toolbar-filter">

                <div class="toolbar-filter-panel" id="filterLevelPanel" role="listbox" hidden></div>

              <input type="search" class="playlist-search" id="playlistSearch" placeholder="搜索歌名/作者/歌手" hidden />
            </div>
            <div class="playlist-header-divider" aria-hidden="true"></div>

              <div class="playlist-grid" id="playlistGrid"></div>
